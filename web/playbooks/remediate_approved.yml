---

- name: "[web_v1] 승인된 항목 조치 (KISA_APPROVAL=true)"
  hosts: "{{ target_hosts | default('all') }}"
  become: yes
  gather_facts: no
  vars:
    kisa_item_env: {}
    kisa_selected_codes: ""
    kisa_confirm: false

  pre_tasks:
    - name: 실행 전 필수 파라미터 확인
      ansible.builtin.assert:
        that:
          - kisa_confirm | bool
          - kisa_selected_codes | length > 0
        fail_msg: "kisa_confirm=true와 kisa_selected_codes=WEB-XX를 지정해야 합니다."
    - name: 배포 여부 확인 (deploy.yml 선행 실행 검증)
      ansible.builtin.stat:
        path: "{{ kisa_remote_active_dir }}/fix"
      register: kisa_fix_dir_stat

    - name: 미배포 시 중단
      ansible.builtin.assert:
        that:
          - kisa_fix_dir_stat.stat.exists
          - kisa_fix_dir_stat.stat.isdir
        fail_msg: >-
          {{ kisa_remote_active_dir }}/fix 가 없습니다. 먼저
          'ansible-playbook playbooks/deploy.yml' 로 check/fix/lib 를 배포하세요.

    - name: 배포된 fix 스크립트 목록 수집
      ansible.builtin.find:
        paths: "{{ kisa_remote_active_dir }}/fix"
        patterns: "WEB-*_fix.sh"
        file_type: file
      register: kisa_fix_scripts

    - name: 배포된 코드 목록 구성
      ansible.builtin.set_fact:
        kisa_deployed_list: >-
          {{ kisa_fix_scripts.files | default([]) | map(attribute="path") | map("basename")
             | map("regex_replace", "_fix\.sh$", "") | list | sort }}

    - name: 선택 코드 목록 구성
      ansible.builtin.set_fact:
        kisa_selected_list: "{{ kisa_selected_codes.split(',') | map('trim') | reject('equalto', '') | list }}"

    - name: 선택 코드 검증
      ansible.builtin.assert:
        that:
          - kisa_selected_list | length > 0
          - kisa_selected_list | select("match", "^WEB-[0-9]{2}$") | list | length == kisa_selected_list | length
          - kisa_selected_list | difference(kisa_deployed_list) | length == 0
        fail_msg: "배포되지 않았거나 형식이 잘못된 WEB 코드가 포함되어 있습니다: {{ kisa_selected_codes }}"

    - name: Apache 설정 복구 선행
      ansible.builtin.set_fact:
        kisa_selected_list: >-
          {{ (["WEB-09"] if "WEB-09" in kisa_selected_list else [])
             + (kisa_selected_list | reject("equalto", "WEB-09") | list) }}

  tasks:
    - name: "승인 항목 조치 실행 ({{ kisa_selected_list | join(', ') }})"
      ansible.builtin.command:
        cmd: "{{ kisa_remote_active_dir }}/fix/{{ item }}_fix.sh"
      environment: "{{ {'KISA_APPROVAL': 'true'} | combine(kisa_item_env[item] | default({})) }}"
      register: kisa_remediate_raw
      loop: "{{ kisa_selected_list }}"
      loop_control:
        label: "{{ item }}"
      changed_when: false
      failed_when: false

    - name: 조치 결과 JSON 파싱
      ansible.builtin.set_fact:
        kisa_remediate_results: "{{ kisa_remediate_raw.results | map(attribute='stdout') | map('from_json') | list }}"

    - name: 조치 결과 콘솔 출력
      ansible.builtin.debug:
        msg: "[{{ item.code }}] status={{ item.status }} :: {{ item.detail }}"
      loop: "{{ kisa_remediate_results }}"
      loop_control:
        label: "{{ item.code }}"

  post_tasks:
    - name: 리포트 디렉토리 생성 (컨트롤 노드)
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../reports"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: no
      run_once: true

    - name: 조치 결과 JSON 저장 (컨트롤 노드)
      ansible.builtin.copy:
        content: "{{ kisa_remediate_results | to_nice_json }}"
        dest: "{{ playbook_dir }}/../reports/{{ inventory_hostname }}_remediate.json"
        mode: "0644"
      delegate_to: localhost
      become: no

