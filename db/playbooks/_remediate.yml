---
- name: "KISA DBMS(MySQL) 조치 (자동조치 항목 실행 + 승인된 승인요청 항목 실행)"
  hosts: "{{ target_hosts | default('mysql_servers') }}"
  become: true
  gather_facts: false
  vars:
    mysql_security_local_report_dir: "{{ playbook_dir }}/../reports"
    mysql_security_auto_only: ""
    mysql_security_selected_codes: ""
    mysql_security_confirm: false
    mysql_security_auto_codes: [D-01, D-02, D-03, D-04, D-07, D-11]
    mysql_security_approval_codes: [D-06, D-08, D-10, D-25]

  pre_tasks:
    - name: 배포 여부 확인 (deploy.yml 선행 실행 검증)
      ansible.builtin.stat:
        path: "{{ mysql_security_remote_dir }}/current/fix"
      register: mysql_security_fix_dir_stat

    - name: 미배포 시 중단
      ansible.builtin.assert:
        that:
          - mysql_security_fix_dir_stat.stat.exists
          - mysql_security_fix_dir_stat.stat.isdir
        fail_msg: >-
          {{ mysql_security_remote_dir }}/current/fix 가 없습니다. 먼저
          ansible-playbook playbooks/deploy.yml 로 check/fix/lib 를 배포하세요.

    - name: 조치 스크립트 존재 및 실행 권한 확인
      ansible.builtin.stat:
        path: "{{ mysql_security_remote_dir }}/current/fix/{{ item }}_fix.sh"
      loop: "{{ mysql_security_auto_codes + mysql_security_approval_codes }}"
      register: mysql_security_fix_script_stats

    - name: 누락되거나 실행할 수 없는 조치 스크립트가 있으면 중단
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - item.stat.isreg | default(false)
          - item.stat.executable | default(false)
        fail_msg: >-
          {{ item.item }} 조치 스크립트가 없거나 실행할 수 없습니다:
          {{ mysql_security_remote_dir }}/current/fix/{{ item.item }}_fix.sh
          deploy.yml 로 최신 release를 다시 배포하세요.
      loop: "{{ mysql_security_fix_script_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: 자동조치 대상 코드 목록화 (mysql_security_auto_only 지정 시 그 부분집합만)
      ansible.builtin.set_fact:
        mysql_security_auto_selected: >-
          {{ ((mysql_security_auto_only.split(',') | map('trim') | list)
              if mysql_security_auto_only else mysql_security_auto_codes)
             if (dbms_remediation_mode | default('approved')) == 'audit' else [] }}

    - name: 자동조치 코드 형식/범위 검증
      ansible.builtin.assert:
        that:
          - mysql_security_auto_selected | difference(mysql_security_auto_codes) | length == 0
        fail_msg: >-
          mysql_security_auto_only 에 자동조치 대상이 아닌 코드가 포함되어 있습니다:
          {{ mysql_security_auto_selected | difference(mysql_security_auto_codes) | join(',') }}
          (자동조치 항목: {{ mysql_security_auto_codes | join(',') }})

    - name: 승인요청 항목 실행 전 필수 파라미터 확인
      ansible.builtin.assert:
        that:
          - mysql_security_confirm | bool
        fail_msg: >-
          mysql_security_selected_codes(콤마로 구분된 조치 대상 코드)와 함께
          mysql_security_confirm=true(관리자 명시적 확인)를 -e 로 지정해야
          승인요청 항목을 조치합니다. 예:
          -e "mysql_security_selected_codes=D-08,D-10" -e "mysql_security_confirm=true"
      when: mysql_security_selected_codes | length > 0

    - name: 승인요청 대상 코드 목록화
      ansible.builtin.set_fact:
        mysql_security_approval_selected: "{{ mysql_security_selected_codes.split(',') | map('trim') | list }}"
      when: mysql_security_selected_codes | length > 0

    - name: 승인요청 코드 범위 검증 (D-06/D-08/D-10/D-25 만 가능)
      ansible.builtin.assert:
        that:
          - mysql_security_approval_selected | difference(mysql_security_approval_codes) | length == 0
        fail_msg: >-
          mysql_security_selected_codes 에 승인요청 대상이 아닌 코드가 포함되어 있습니다:
          {{ mysql_security_approval_selected | difference(mysql_security_approval_codes) | join(',') }}
          (승인요청 항목: {{ mysql_security_approval_codes | join(',') }})
      when: mysql_security_selected_codes | length > 0

  tasks:
    - name: 조치 설정 디렉터리 생성
      ansible.builtin.file:
        path: "{{ mysql_security_remote_dir }}/config"
        state: directory
        mode: "0750"

    - name: MySQL 접속 정보 디렉터리 생성
      ansible.builtin.file:
        path: "{{ mysql_security_defaults_file | dirname }}"
        state: directory
        mode: "0700"

    - name: MySQL 접속 정보 파일 배치
      ansible.builtin.template:
        src: ../templates/mysql_credentials.cnf.j2
        dest: "{{ mysql_security_defaults_file }}"
        mode: "0600"
      no_log: true

    - name: 조치 설정 파일 배치
      ansible.builtin.template:
        src: ../templates/mysql_security.conf.j2
        dest: "{{ mysql_security_remote_dir }}/config/mysql_security.conf"
        mode: "0640"

    - name: 조치 전 mysqld 설정 파일 백업 확인 안내
      ansible.builtin.debug:
        msg: >-
          fix/D-03_fix.sh, fix/D-07_fix.sh 가
          {{ mysql_security_my_cnf_path | default('/etc/my.cnf') }} 변경 시
          자동으로 타임스탬프 백업본을 생성합니다.

    - name: "자동조치 항목 조치 실행 ({{ mysql_security_auto_selected | join(', ') }})"
      ansible.builtin.command:
        cmd: "./fix/{{ item }}_fix.sh"
        chdir: "{{ mysql_security_remote_dir }}/current"
      environment:
        MYSQL_SECURITY_CONF: "{{ mysql_security_remote_dir }}/config/mysql_security.conf"
      register: mysql_security_auto_raw
      loop: "{{ mysql_security_auto_selected }}"
      loop_control:
        label: "{{ item }}"
      changed_when: false
      failed_when: false

    - name: "승인요청 항목 조치 실행 ({{ mysql_security_approval_selected | default([]) | join(', ') }})"
      ansible.builtin.command:
        cmd: "./fix/{{ item }}_fix.sh"
        chdir: "{{ mysql_security_remote_dir }}/current"
      environment:
        MYSQL_SECURITY_CONF: "{{ mysql_security_remote_dir }}/config/mysql_security.conf"
        KISA_APPROVAL: "true"
      register: mysql_security_approval_raw
      loop: "{{ mysql_security_approval_selected | default([]) }}"
      loop_control:
        label: "{{ item }}"
      changed_when: false
      failed_when: false
      when: mysql_security_selected_codes | length > 0

    - name: 조치 명령 결과 목록 구성
      ansible.builtin.set_fact:
        mysql_security_execution_results: >-
          {{ (mysql_security_auto_raw.results | default([]))
             + (mysql_security_approval_raw.results | default([])) }}

    - name: 조치 명령 출력 규약 검증
      ansible.builtin.assert:
        that:
          - item.rc | int in [0, 1, 2, 3]
          - item.stdout | default('') | trim | length > 0
          - item.stdout | trim is match('^\{.*\}$')
        fail_msg: >-
          {{ item.item | default('알 수 없는 항목') }} 조치 스크립트가 유효한 JSON을
          출력하지 않았습니다. rc={{ item.rc | default('없음') }},
          stdout={{ item.stdout | default('') }}, stderr={{ item.stderr | default('') }}
      loop: "{{ mysql_security_execution_results }}"
      loop_control:
        label: "{{ item.item | default('알 수 없는 항목') }}"

    - name: 조치 결과 JSON 파싱
      ansible.builtin.set_fact:
        mysql_security_remediate_results: >-
          {{ mysql_security_execution_results
             | map(attribute='stdout') | map('from_json') | list }}

    - name: 조치 결과 콘솔 출력
      ansible.builtin.debug:
        msg: "[{{ item.code }}] status={{ item.status }} :: {{ item.detail }}"
      loop: "{{ mysql_security_remediate_results }}"
      loop_control:
        label: "{{ item.code }}"

    - name: 로컬 리포트 디렉터리 생성 (컨트롤 노드)
      ansible.builtin.file:
        path: "{{ mysql_security_local_report_dir }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      become: false

    - name: 조치 결과 JSON 저장 (컨트롤 노드)
      ansible.builtin.copy:
        content: "{{ mysql_security_remediate_results | to_nice_json }}"
        dest: "{{ mysql_security_local_report_dir }}/{{ inventory_hostname }}_remediate.json"
        mode: "0644"
      delegate_to: localhost
      become: false

    - name: 조치 후 재점검 실행 (D-01~D-25 전체)
      ansible.builtin.command:
        cmd: "./lib/run_checks.sh"
        chdir: "{{ mysql_security_remote_dir }}/current"
      environment:
        MYSQL_SECURITY_CONF: "{{ mysql_security_remote_dir }}/config/mysql_security.conf"
      register: mysql_security_post_check_result
      changed_when: false
      failed_when: mysql_security_post_check_result.rc != 0

    - name: 조치 후 재점검 결과 파싱
      ansible.builtin.set_fact:
        mysql_security_post_check_findings: >-
          {{ mysql_security_post_check_result.stdout_lines
             | reject('equalto', '')
             | map('from_json')
             | list
             | sort(attribute='code') }}

    - name: 조치 후 재점검 결과 요약 출력
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} (조치 후 재점검) :
          FAIL={{ mysql_security_post_check_findings | selectattr('status','equalto','취약') | list | length }},
          MANUAL={{ mysql_security_post_check_findings | selectattr('status','equalto','점검필요') | list | length }},
          PASS={{ mysql_security_post_check_findings | selectattr('status','equalto','양호') | list | length }}

    - name: 조치 후 재점검 결과 JSON 저장 (컨트롤 노드, check.yml 과 같은 파일 갱신)
      ansible.builtin.copy:
        content: "{{ mysql_security_post_check_findings | to_nice_json }}"
        dest: "{{ mysql_security_local_report_dir }}/{{ inventory_hostname }}_mysql_dbms_check.json"
        mode: "0644"
      delegate_to: localhost
      become: false

    - name: D-01/D-08 로 생성된 신규 비밀번호 파일 존재 여부 경고
      ansible.builtin.find:
        paths: /root
        patterns: "mysql_security_*_passwords_*.txt"
      register: mysql_security_pw_files

    - name: 신규 비밀번호 파일 안전 보관 경고
      ansible.builtin.debug:
        msg: >-
          경고: {{ inventory_hostname }} 의 /root 에 자동 생성된 비밀번호 파일이
          {{ mysql_security_pw_files.files | length }}개 존재합니다.
          {{ mysql_security_pw_files.files | map(attribute='path') | list }}
          안전한 채널로 인수인계 후 서버에서는 반드시 삭제하세요.
      when: mysql_security_pw_files.files | length > 0
