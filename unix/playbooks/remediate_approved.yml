---

- name: "[project] 승인된 항목 조치 (KISA_APPROVAL=true)"
  hosts: "{{ target_hosts | default('all') }}"
  become: "{{ kisa_become | default(true) | bool }}"
  gather_facts: no
  vars:
    kisa_become: true
    kisa_selected_codes: ""
    kisa_item_env: {}
    kisa_confirm: false

  pre_tasks:
    - name: 원격 접속 UID 확인 (sudo 사용 안 함)
      ansible.builtin.command:
        cmd: id -u
      register: kisa_remote_uid
      become: false
      changed_when: false

    - name: 활성 sudo 소유권/SUID 사전 검사 (sudo 사용 안 함)
      ansible.builtin.shell:
        cmd: |
          sudo_path="$(command -v sudo 2>/dev/null || true)"
          [ -n "$sudo_path" ] || {
            printf 'sudo 명령을 찾을 수 없음\n'
            exit 1
          }
          sudo_real="$(readlink -f -- "$sudo_path" 2>/dev/null || printf '%s' "$sudo_path")"
          uid="$(stat -Lc '%u' -- "$sudo_real" 2>/dev/null || true)"
          mode="$(stat -Lc '%a' -- "$sudo_real" 2>/dev/null || true)"
          printf 'path=%s uid=%s mode=%s\n' "$sudo_real" "$uid" "$mode"
          [ "$uid" = "0" ] && [ $((8#$mode & 04000)) -ne 0 ]
        executable: /bin/bash
      register: kisa_sudo_preflight
      become: false
      changed_when: false
      failed_when: false

    - name: root 권한 실행 경로 확인
      ansible.builtin.assert:
        that:
          - >-
            (kisa_remote_uid.stdout | trim == '0' and not (kisa_become | bool))
            or
            (kisa_remote_uid.stdout | trim != '0' and (kisa_become | bool) and kisa_sudo_preflight.rc == 0)
        fail_msg: >-
          root 권한 실행 경로를 사용할 수 없습니다.
          접속 UID={{ kisa_remote_uid.stdout | trim }},
          활성 sudo={{ kisa_sudo_preflight.stdout | trim | default('확인 실패', true) }}.
          sudo가 root 소유가 아니거나 SUID 비트가 빠졌다면 이 플레이북으로는
          sudo 자체를 복구할 수 없습니다. 콘솔 또는 'su -'로 root가 된 뒤
          위 path에 'chown root:root <path> && chmod 4755 <path>'를 실행하십시오.
          root SSH로 직접 접속하는 경우에는 -e kisa_become=false 를 추가하십시오.
      become: false

    - name: 배포 여부 확인 (deploy.yml 선행 실행 검증)
      ansible.builtin.stat:
        path: "{{ kisa_remote_active_dir }}/fix"
      register: kisa_fix_dir_stat

    - name: 미배포 시 중단
      ansible.builtin.assert:
        that:
          - kisa_fix_dir_stat.stat.exists
          - kisa_fix_dir_stat.stat.isdir
        fail_msg: >-
          {{ kisa_remote_active_dir }}/fix 가 없습니다. 먼저
          'ansible-playbook playbooks/deploy.yml' 로 check/fix/lib 를 배포하세요.

    - name: 실행 전 필수 파라미터 확인 (관리자 명시적 확인)
      ansible.builtin.assert:
        that:
          - kisa_confirm | bool
        fail_msg: >-
          kisa_confirm=true(관리자 명시적 확인)를 -e 로 지정해야 합니다.
          kisa_selected_codes 를 함께 주면 해당 항목만, 생략하면 배포된
          fix/ 의 전체 항목을 조치합니다.
          예: -e "kisa_selected_codes=U-05,U-60" -e "kisa_confirm=true"
             또는 전체 조치: -e "kisa_confirm=true"

    - name: (전체 조치) 배포된 fix 스크립트 목록 수집
      ansible.builtin.find:
        paths: "{{ kisa_remote_active_dir }}/fix"
        patterns: "U-*_fix.sh"
        file_type: file
      register: kisa_fix_scripts
      when: kisa_selected_codes | length == 0

    - name: 대상 코드 리스트 구성 (명시적 지정 시)
      ansible.builtin.set_fact:
        kisa_selected_list: "{{ kisa_selected_codes.split(',') | map('trim') | reject('equalto', '') | list }}"
      when: kisa_selected_codes | length > 0

    - name: 대상 코드 리스트 구성 (전체 조치 시 - 배포된 fix 스크립트에서 추출)
      ansible.builtin.set_fact:
        kisa_selected_list: >-
          {{ kisa_fix_scripts.files | default([]) | map(attribute='path') | map('basename')
             | map('regex_replace', '_fix\.sh$', '') | list | sort }}
      when: kisa_selected_codes | length == 0

    - name: 대상 코드가 하나도 없으면 중단
      ansible.builtin.assert:
        that:
          - kisa_selected_list | length > 0
        fail_msg: >-
          조치 대상 코드가 없습니다. kisa_selected_codes 를 지정하거나,
          {{ kisa_remote_active_dir }}/fix 에 U-*_fix.sh 가 배포되어 있는지 확인하세요.

    - name: 코드 형식(U-XX) 검증
      ansible.builtin.assert:
        that:
          - kisa_selected_list | select('match', '^U-[0-9]{2}$') | list | length == kisa_selected_list | length
        fail_msg: >-
          kisa_selected_codes 에 'U-XX' 형식이 아닌 값이 포함되어 있습니다: {{ kisa_selected_codes }}
      when: kisa_selected_codes | length > 0

    - name: 코드 범위(U-01~U-67, 실제 존재하는 스크립트) 검증
      ansible.builtin.assert:
        that:
          - (item.split('-')[1] | int) >= 1
          - (item.split('-')[1] | int) <= 67
        fail_msg: >-
          '{{ item }}' 는 유효한 KISA 항목 코드가 아닙니다(U-01~U-67 범위 밖).
          형식은 맞아도 실제 존재하지 않는 코드면 fix 스크립트가 없어
          이후 단계에서 JSON 파싱 오류로 실패합니다.
      loop: "{{ kisa_selected_list }}"
      loop_control:
        label: "{{ item }}"
      when: kisa_selected_codes | length > 0

  tasks:
    - name: "승인 항목 조치 실행 ({{ kisa_selected_list | join(', ') }})"
      ansible.builtin.command:
        cmd: "{{ kisa_remote_active_dir }}/fix/{{ item }}_fix.sh"
      environment: "{{ {'KISA_APPROVAL': 'true'} | combine(kisa_item_env[item] | default({})) }}"
      register: kisa_remediate_raw
      loop: "{{ kisa_selected_list }}"
      loop_control:
        label: "{{ item }}"
      changed_when: false
      failed_when: false

    - name: 조치 결과 stdout 목록화
      ansible.builtin.set_fact:
        kisa_remediate_stdouts: "{{ kisa_remediate_raw.results | map(attribute='stdout') | map('default', '') | map('trim') | list }}"

    - name: JSON 을 출력하지 않은 조치 항목 탐지
      ansible.builtin.set_fact:
        kisa_bad_output_codes: "{{ kisa_bad_output_codes | default([]) + [ kisa_selected_list[kisa_idx] ] }}"
      loop: "{{ kisa_remediate_stdouts }}"
      loop_control:
        index_var: kisa_idx
        label: "{{ kisa_selected_list[kisa_idx] }}"
      when: not (item is match('^\s*[{].*[}]\s*$'))

    - name: 비JSON 출력 항목 경고 (결과 리포트에서 제외됨)
      ansible.builtin.debug:
        msg: >-
          경고: {{ kisa_bad_output_codes | join(', ') }} 의 조치 스크립트가 JSON 을
          출력하지 않아 결과 리포트에서 제외됨. 해당 호스트에서 스크립트를 직접
          실행해 원인을 확인하십시오(예: 권한 상실로 sudo/su 불가).
      when: kisa_bad_output_codes | default([]) | length > 0

    - name: 조치 결과 JSON 파싱 (JSON 형태 출력만)
      ansible.builtin.set_fact:
        kisa_remediate_results: "{{ kisa_remediate_stdouts | select('match', '^\\s*[{].*[}]\\s*$') | map('from_json') | list }}"

    - name: 조치 결과 콘솔 출력
      ansible.builtin.debug:
        msg: "[{{ item.code }}] status={{ item.status }} :: {{ item.detail }}"
      loop: "{{ kisa_remediate_results }}"
      loop_control:
        label: "{{ item.code }}"

    - name: U-01 포함 시 SSH 재접속 확인
      when: "'U-01' in kisa_selected_list"
      block:
        - name: 연결 재설정
          ansible.builtin.meta: reset_connection

        - name: SSH 재접속 가능 여부 대기 확인(최대 30초)
          ansible.builtin.wait_for_connection:
            timeout: 30
      rescue:
        - name: 재접속 실패 경고
          ansible.builtin.debug:
            msg: >-
              경고: U-01 조치 후 {{ inventory_hostname }} 에 SSH 재접속을
              확인하지 못했습니다. 별도 접속 경로(콘솔 등)로 sshd 상태와
              /etc/ssh/sshd_config 를 직접 확인하십시오.

  post_tasks:
    - name: 리포트 디렉토리 생성 (컨트롤 노드)
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../reports"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: no
      run_once: true

    - name: 조치 결과 JSON 저장 (컨트롤 노드)
      ansible.builtin.copy:
        content: "{{ kisa_remediate_results | to_nice_json }}"
        dest: "{{ playbook_dir }}/../reports/{{ inventory_hostname }}_remediate.json"
        mode: "0644"
      delegate_to: localhost
      become: no
